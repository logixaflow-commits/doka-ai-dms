version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dms-postgres
    environment:
      POSTGRES_DB: dms_db
      POSTGRES_USER: dms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Database is reachable only by services on dms-network. Use an SSH tunnel
    # or a separate, access-controlled maintenance override for operator access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms_user -d dms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dms-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dms-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dms-network

  # MinIO Object Storage
  minio:
    # Supply an immutable, reviewed tag or digest from deployment configuration.
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to a reviewed immutable tag or digest}
    container_name: dms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - dms-network

  # FastAPI Backend
  backend:
    build:
      context: ../../apps/web-platform/backend
      dockerfile: Dockerfile.production
    container_name: dms-backend
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a 32+ character random value}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS to the HTTPS frontend origin}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:?Set TRUSTED_HOSTS to the public API hostname}
      - DATABASE_URL=postgresql://dms_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/dms_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      - MINIO_SECURE=false
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - dms-network

  # Celery Worker
  celery-worker:
    build:
      context: ../../apps/web-platform/backend
      dockerfile: Dockerfile.production
    container_name: dms-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a 32+ character random value}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS to the HTTPS frontend origin}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:?Set TRUSTED_HOSTS to the public API hostname}
      - DATABASE_URL=postgresql://dms_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/dms_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    networks:
      - dms-network

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ../../apps/web-platform/backend
      dockerfile: Dockerfile.production
    container_name: dms-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a 32+ character random value}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS to the HTTPS frontend origin}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:?Set TRUSTED_HOSTS to the public API hostname}
      - DATABASE_URL=postgresql://dms_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/dms_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - dms-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dms-nginx
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dms-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads:
  logs:

networks:
  dms-network:
    driver: bridge

# =============================================================================
# Office DMS - User Configuration
# =============================================================================
# This file contains user-editable configuration for document classification,
# supplier mapping, regex patterns, SOP templates, and processing thresholds.
# =============================================================================

# --- Social Media Watch Sources (Multi-Source Folder Watching) ------------------
# Configure multiple social media download folders to watch for automatic ingestion
# Files from these sources will be organized by date: Organized/Social_Media/YYYY-MM-DD/
# Naming convention: {Date}_{Source}_{Category}_{OriginalName}.pdf
watch_sources:
  - name: "Viber"
    path: "C:/Users/User/Documents/ViberDownloads"
    enabled: true
    auto_rename: true
    preserve_original: true
    description: "Viber downloads folder for documents shared via Viber"

  - name: "WhatsApp"
    path: "C:/Users/User/Downloads/WhatsApp"
    enabled: true
    auto_rename: true
    preserve_original: true
    description: "WhatsApp downloads folder for documents shared via WhatsApp"

  - name: "Facebook"
    path: "C:/Users/User/Downloads/Facebook"
    enabled: false
    auto_rename: true
    preserve_original: true
    description: "Facebook downloads folder for documents from Facebook"

  - name: "Telegram"
    path: "C:/Users/User/Downloads/Telegram"
    enabled: false
    auto_rename: true
    preserve_original: true
    description: "Telegram downloads folder for documents shared via Telegram"

# --- Social Media Organization Configuration ----------------------------------
social_media:
  # Base folder for organized social media documents
  base_folder: "Organized/Social_Media"
  # Date format for folder naming (YYYY-MM-DD)
  date_format: "%Y-%m-%d"
  # Naming template for social media files
  naming_template: "{date}_{source}_{category}_{original_name}"
  # Whether to create daily folders automatically
  create_daily_folders: true

# --- Supplier Configuration --------------------------------------------------
suppliers:

name: Cloudflare Worker Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment of the main-branch Worker to production
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Doka Worker
    if: inputs.confirm_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
      - name: Install Python Worker build tooling
        run: python -m pip install --upgrade uv
      - name: Deploy Worker from repository source
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

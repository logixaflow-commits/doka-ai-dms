name: Local Core Checks

on:
  push:
    branches: [main]
    paths:
      - "web-platform/backend/**"
      - "web-platform/tests/**"
      - "cloudflare_worker/**"
      - "scripts/**"
      - "pyproject.toml"
      - "wrangler.jsonc"
      - "supabase/migrations/**"
      - ".github/workflows/local-core-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "web-platform/backend/**"
      - "web-platform/tests/**"
      - "web-platform/frontend/**"
      - "cloudflare_worker/**"
      - "scripts/**"
      - "pyproject.toml"
      - "wrangler.jsonc"
      - "supabase/migrations/**"
      - ".github/workflows/local-core-check.yml"

# Cancel superseded runs of this workflow on the same ref to conserve monthly runner minutes.
concurrency:
  group: local-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall -q web-platform/backend
          python -m py_compile scripts/doka_pilot_check.py scripts/ocr_benchmark.py

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-platform/backend/requirements-local.txt
      - name: Install Personal Local dependencies
        run: pip install -r web-platform/backend/requirements-local.txt
      - name: Run local safety regression tests
        env:
          ENVIRONMENT: development
          DEBUG: "false"
          SECRET_KEY: doka-local-core-ci-secret-key-32-bytes-minimum
          PYTHONPATH: web-platform/backend
        run: |
          pytest -q web-platform/tests/test_safe_workspace_service.py web-platform/tests/test_workspace_backup_service.py web-platform/tests/test_organization_planner.py web-platform/tests/test_workspace_security.py web-platform/tests/test_document_understanding.py web-platform/tests/test_local_auth.py web-platform/tests/test_unified_ai_fallback.py web-platform/tests/test_observability.py web-platform/tests/test_hardening.py web-platform/tests/test_doka_pilot.py web-platform/tests/test_ocr_benchmark.py web-platform/tests/test_cloud_storage.py

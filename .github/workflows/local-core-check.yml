name: Local Core Checks

on:
  # The consolidated Doka Quality Checks workflow handles automatic CI.
  # Keep this extended local-core suite available for deliberate manual runs.
  workflow_dispatch:

# Cancel superseded runs of this workflow on the same ref to conserve monthly runner minutes.
concurrency:
  group: local-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall -q apps/web-platform/backend
          python -m py_compile scripts/doka_pilot_check.py scripts/ocr_benchmark.py

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/web-platform/backend/requirements-local.txt
      - name: Install Personal Local dependencies
        run: pip install -r apps/web-platform/backend/requirements-local.txt
      - name: Run local safety regression tests
        env:
          ENVIRONMENT: development
          DEBUG: "false"
          SECRET_KEY: doka-local-core-ci-secret-key-32-bytes-minimum
          PYTHONPATH: apps/web-platform/backend
        run: |
          pytest -q apps/web-platform/tests/test_safe_workspace_service.py apps/web-platform/tests/test_workspace_backup_service.py apps/web-platform/tests/test_organization_planner.py apps/web-platform/tests/test_workspace_security.py apps/web-platform/tests/test_document_understanding.py apps/web-platform/tests/test_local_auth.py apps/web-platform/tests/test_unified_ai_fallback.py apps/web-platform/tests/test_observability.py apps/web-platform/tests/test_hardening.py apps/web-platform/tests/test_doka_pilot.py apps/web-platform/tests/test_ocr_benchmark.py apps/web-platform/tests/test_cloud_storage.py

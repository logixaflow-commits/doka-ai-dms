name: Local Core Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall -q web-platform/backend
          python -m py_compile scripts/doka_pilot_check.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: web-platform/frontend
        run: npm ci
      - name: Build frontend
        working-directory: web-platform/frontend
        run: npm run build
      - name: Run frontend tests
        working-directory: web-platform/frontend
        run: npm test

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Personal Local dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web-platform/backend/requirements-local.txt
      - name: Run local safety regression tests
        env:
          ENVIRONMENT: development
          DEBUG: "false"
          SECRET_KEY: doka-local-core-ci-secret-key-32-bytes-minimum
          PYTHONPATH: web-platform/backend
        run: |
          pytest -q web-platform/tests/test_safe_workspace_service.py web-platform/tests/test_workspace_backup_service.py web-platform/tests/test_organization_planner.py web-platform/tests/test_workspace_security.py web-platform/tests/test_document_understanding.py web-platform/tests/test_local_auth.py web-platform/tests/test_unified_ai_fallback.py web-platform/tests/test_observability.py web-platform/tests/test_hardening.py web-platform/tests/test_doka_pilot.py web-platform/tests/test_cloud_storage.py

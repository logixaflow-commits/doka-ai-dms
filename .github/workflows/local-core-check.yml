name: Local Core Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q dms

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npm run build
      - name: Run frontend tests
        working-directory: app
        run: npm test

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.0.0 pytest-asyncio==0.23.0 pytest-cov pydantic pyyaml python-dotenv loguru httpx fastapi sqlalchemy python-jose bcrypt
      - name: Run local safety regression tests
        env:
          ENVIRONMENT: development
          DEBUG: "false"
          SECRET_KEY: test-secret-key
          PYTHONPATH: dms
        run: |
          pytest -q tests/test_safe_workspace_service.py tests/test_workspace_backup_service.py tests/test_organization_planner.py tests/test_workspace_security.py tests/test_document_understanding.py tests/test_local_auth.py tests/test_unified_ai_fallback.py tests/test_observability.py

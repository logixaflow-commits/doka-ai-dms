name: Vercel Production Smoke Check

# Vercel Git Integration owns deployments. This workflow verifies the live
# production alias after a frontend/config change; it does not pretend to deploy.
on:
  # Vercel production is intentionally paused; run this check manually only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: Verify Vercel production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment and verify HTTP response
        env:
          PRODUCTION_URL: https://enterprise-ai-dms.vercel.app
        run: |
          for attempt in $(seq 1 24); do
            status=$(curl --silent --show-error --location --output /tmp/doka-production.html --write-out "%{http_code}" "$PRODUCTION_URL" || true)
            if [ "$status" = "200" ] && grep -q "Doka — Secure Document Workspace" /tmp/doka-production.html; then
              echo "Production alias returned HTTP 200 and the expected Doka document title."
              exit 0
            fi
            echo "Attempt $attempt/24: production not ready yet (HTTP ${status:-unavailable}); retrying in 10 seconds."
            sleep 10
          done
          echo "::error::Production alias did not return the expected Doka page after 4 minutes."
          exit 1

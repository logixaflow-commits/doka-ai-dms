name: Doka Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "web-platform/backend/**"
      - "web-platform/tests/**"
      - "web-platform/frontend/**"
      - "cloudflare_worker/**"
      - "pyproject.toml"
      - "web-platform/backend/requirements*.txt"
      - "supabase/migrations/**"
      - ".github/workflows/doka-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "web-platform/backend/**"
      - "web-platform/tests/**"
      - "web-platform/frontend/**"
      - "cloudflare_worker/**"
      - "supabase/migrations/**"
      - ".github/workflows/doka-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-dependency-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend runtime dependencies
        run: |
          pip-audit -r web-platform/backend/requirements-production.txt --format=json > backend-production-audit.json || true
          pip-audit -r web-platform/backend/requirements.txt --format=json > backend-full-audit.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ("backend-production-audit.json", "backend-full-audit.json"):
              report = json.loads(Path(filename).read_text(encoding="utf-8"))
              vulnerabilities = [
                  {"name": item.get("name"), "version": item.get("version"), "id": vuln.get("id"), "fix_versions": vuln.get("fix_versions", [])}
                  for item in report
                  for vuln in item.get("vulns", [])
              ]
              print(f"{filename}: {len(vulnerabilities)} findings")
              for finding in vulnerabilities:
                  print(f"  {finding['name']} {finding['version']} {finding['id']} fixes={finding['fix_versions']}")
          PY
      - name: Upload backend dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-audit
          path: |
            backend-production-audit.json
            backend-full-audit.json
          if-no-files-found: ignore
          retention-days: 7

  backend-tests:
    name: Backend regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-platform/backend/requirements-local.txt
      - name: Install backend test dependencies
        working-directory: web-platform/backend
        run: python -m pip install -r requirements-local.txt
      - name: Run backend regression suite
        working-directory: web-platform/backend
        run: python -m pytest
      - name: Run Worker and database contract tests
        run: python -m pytest web-platform/tests/test_cloudflare_worker_contract.py

  frontend-checks:
    name: Frontend build and smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: web-platform/frontend
        run: npm ci
      - name: Capture dependency audit baseline
        working-directory: web-platform/frontend
        run: |
          npm audit --json > npm-audit-before.json || true
          node -e 'const a=require("./npm-audit-before.json"); console.log("Before remediation:", JSON.stringify(a.metadata?.vulnerabilities));'
      - name: Apply semver-compatible dependency security fixes
        working-directory: web-platform/frontend
        run: npm audit fix --package-lock-only
      - name: Reinstall from remediated lockfile
        working-directory: web-platform/frontend
        run: npm ci
      - name: Report frontend dependency audit details
        working-directory: web-platform/frontend
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const rows=Object.entries(a.vulnerabilities || {}).map(([name,v]) => ({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable})); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,packages:rows}, null, 2));'
      - name: Report frontend lint baseline
        working-directory: web-platform/frontend
        run: |
          ./node_modules/.bin/eslint . --format json > eslint-report.json || true
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync("eslint-report.json","utf8")); const totals=r.reduce((a,f)=>({errors:a.errors+f.errorCount,warnings:a.warnings+f.warningCount,files:a.files+(f.errorCount+f.warningCount>0?1:0)}),{errors:0,warnings:0,files:0}); const rules={}; for (const f of r) for (const m of f.messages) if(m.ruleId) rules[m.ruleId]=(rules[m.ruleId]||0)+1; console.log(JSON.stringify({...totals,topRules:Object.entries(rules).sort((a,b)=>b[1]-a[1]).slice(0,10)},null,2));'
      - name: Build frontend
        working-directory: web-platform/frontend
        run: npm run build
      - name: Run frontend smoke tests
        working-directory: web-platform/frontend
        run: npm test
      - name: Require clean frontend dependency audit
        working-directory: web-platform/frontend
        run: npm audit --audit-level=low
      - name: Commit verified dependency lockfile remediation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-platform/frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency lockfile changes to commit."
          else
            git commit -m "fix(deps): remediate frontend npm advisories"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not push the verified lockfile after three fetch/rebase attempts." >&2
            exit 1
          fi
      - name: Upload dependency and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-remediation-candidate
          path: |
            web-platform/frontend/npm-audit-before.json
            web-platform/frontend/npm-audit.json
            web-platform/frontend/eslint-report.json
            web-platform/frontend/package-lock.json
          if-no-files-found: ignore
          retention-days: 7

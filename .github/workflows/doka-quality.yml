name: Doka Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "web-platform/backend/**"
      - "web-platform/tests/**"
      - "web-platform/frontend/**"
      - "cloudflare_worker/**"
      - "scripts/**"
      - "shared/**"
      - "supabase/**"
      - "pyproject.toml"
      - "web-platform/backend/requirements*.txt"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".dockerignore"
      - ".github/workflows/**"
      - "infrastructure/env/**"
  pull_request:
    branches: [main]
    paths:
      - "web-platform/backend/**"
      - "web-platform/tests/**"
      - "web-platform/frontend/**"
      - "cloudflare_worker/**"
      - "scripts/**"
      - "shared/**"
      - "supabase/**"
      - "pyproject.toml"
      - "web-platform/backend/requirements*.txt"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".dockerignore"
      - ".github/workflows/**"
      - "infrastructure/env/**"
  workflow_dispatch:

# Cancel superseded runs of this workflow on the same ref to conserve monthly runner minutes.
concurrency:
  group: doka-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-dependency-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository for committed secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP:/report" \
            zricethezav/gitleaks:v8.24.3 \
            dir --redact --report-format sarif --report-path /report/gitleaks.sarif --no-banner --exit-code 1 /repo
      - name: Upload redacted secret scan findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-redacted-report
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend runtime dependencies
        run: |
          # PYSEC-2025-183 is disputed and concerns caller-selected HMAC key length;
          # Doka enforces a minimum 32-byte SECRET_KEY for HS256.
          set -euo pipefail
          profiles=(
            "requirements.txt"
            "requirements-production.txt"
            "requirements-local.txt"
            "requirements-dev.txt"
            "requirements-test.txt"
            "requirements-cloud.txt"
          )
          for profile in "${profiles[@]}"; do
            report="backend-${profile%.txt}-audit.json"
            echo "Auditing web-platform/backend/$profile"
            pip-audit -r "web-platform/backend/$profile" --ignore-vuln PYSEC-2025-183 --format=json > "$report" || status=$?
            status=${status:-0}
            if [ "$status" -gt 1 ]; then
              echo "pip-audit failed operationally for $profile (exit $status)." >&2
              exit "$status"
            fi
            unset status
          done
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path(".").glob("backend-*-audit.json"))
          if len(reports) != 6:
              raise SystemExit(f"Expected six backend audit reports, found {len(reports)}.")
          has_findings = False
          for filename in reports:
              report = json.loads(filename.read_text(encoding="utf-8"))
              dependencies = report.get("dependencies", []) if isinstance(report, dict) else report
              vulnerabilities = [
                  {"name": item.get("name"), "version": item.get("version"), "id": vuln.get("id"), "fix_versions": vuln.get("fix_versions", [])}
                  for item in dependencies
                  for vuln in item.get("vulns", [])
              ]
              print(f"{filename}: {len(vulnerabilities)} unignored findings")
              for finding in vulnerabilities:
                  print(f"  {finding['name']} {finding['version']} {finding['id']} fixes={finding['fix_versions']}")
              has_findings = has_findings or bool(vulnerabilities)
          if has_findings:
              raise SystemExit("Backend dependency audit found unignored vulnerabilities.")
          PY
      - name: Upload backend dependency audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-dependency-audit
          path: |
            backend-production-audit.json
            backend-*-audit.json
          if-no-files-found: ignore
          retention-days: 7

  root-project-dependency-audit:
    name: Root project dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit root project runtime and dev dependencies
        run: |
          set -euo pipefail
          requirements="$RUNNER_TEMP/root-project-requirements.txt"
          report="$RUNNER_TEMP/root-project-audit.json"
          python - "$requirements" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          dependencies = project.get("project", {}).get("dependencies", [])
          dev_dependencies = project.get("dependency-groups", {}).get("dev", [])
          if not all(isinstance(item, str) for item in dependencies + dev_dependencies):
              raise SystemExit("pyproject.toml dependency declarations must be strings.")
          Path(sys.argv[1]).write_text(
              "\n".join([*dependencies, *dev_dependencies]) + "\n",
              encoding="utf-8",
          )
          print(
              f"Auditing {len(dependencies)} runtime and "
              f"{len(dev_dependencies)} dev dependency declarations."
          )
          PY
          status=0
          pip-audit -r "$requirements" --format=json > "$report" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "pip-audit failed operationally for the root project (exit $status)." >&2
            exit "$status"
          fi
          python - "$report" "$status" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Could not read pip-audit JSON report: {exc}") from exc
          dependencies = report.get("dependencies", []) if isinstance(report, dict) else report
          vulnerabilities = [
              (item.get("name"), item.get("version"), vuln.get("id"), vuln.get("fix_versions", []))
              for item in dependencies
              for vuln in item.get("vulns", [])
          ]
          print(f"Root project audit: {len(vulnerabilities)} findings.")
          for name, version, vuln_id, fixes in vulnerabilities:
              print(f"  {name} {version} {vuln_id} fixes={fixes}")
          if vulnerabilities:
              raise SystemExit("Root project dependency audit found vulnerabilities.")
          if int(sys.argv[2]) != 0:
              raise SystemExit(f"pip-audit exited with status {sys.argv[2]} without reportable findings.")
          PY

  workflow-configuration-sanity:
    name: Workflow configuration sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate required quality configuration
        run: |
          set -euo pipefail
          test -s .github/dependabot.yml
          test -s .github/workflows/dependency-review.yml
          test -s .github/workflows/codeql.yml
          test -s web-platform/frontend/package-lock.json
          python - <<'PY'
          import tomllib
          from pathlib import Path
          pyproject = Path("pyproject.toml")
          if pyproject.exists():
              tomllib.loads(pyproject.read_text(encoding="utf-8"))
          print("Doka release-quality configuration is structurally present.")
          PY

  backend-tests:
    name: Backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-platform/backend/requirements-local.txt
      - name: Install backend test dependencies
        working-directory: web-platform/backend
        run: python -m pip install -r requirements-local.txt
      - name: Compile backend and pilot utilities
        run: |
          python -m compileall -q web-platform/backend
          python -m py_compile scripts/doka_pilot_check.py scripts/ocr_benchmark.py
      - name: Verify D1 migration manifest
        run: python scripts/verify_d1_migrations.py --manifest cloudflare_worker/migrations/manifest.json
      - name: Run Personal Local and repository regression suite
        working-directory: web-platform/backend
        run: PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/web-platform/backend" python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Export Cloud API OpenAPI contract
        working-directory: web-platform/backend
        run: python ../../scripts/export_cloud_openapi.py artifacts/cloud-openapi.json
      - name: Upload backend coverage and OpenAPI artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-and-openapi
          path: |
            web-platform/backend/coverage.xml
            web-platform/backend/artifacts/cloud-openapi.json
          if-no-files-found: ignore
          retention-days: 7

  cloud-storage-contracts:
    name: Cloud storage contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r web-platform/backend/requirements-test.txt
      - name: Compile Cloudflare Worker and shared contracts
        run: python -m compileall -q cloudflare_worker shared
      - name: Run cloud storage provider contracts
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/web-platform/backend" python -m pytest -q             web-platform/tests/test_cloud_storage_routing.py             web-platform/tests/test_cloudflare_storage_direct_upload.py             web-platform/tests/test_cloudflare_b2_storage.py             web-platform/tests/test_cloudflare_b2_quota.py             web-platform/tests/test_cloudflare_cloudinary_guard.py             web-platform/tests/test_cloudflare_storage_router.py             web-platform/tests/test_doka_storage_metadata_migration.py

  symlink-security:
    name: Symlink security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        working-directory: web-platform/backend
        run: python -m pip install -r requirements-test.txt
      - name: Run symlink security tests
        working-directory: web-platform/backend
        run: pytest tests/test_symlink_safety.py -v -o addopts=""

  frontend-checks:
    name: Frontend build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: web-platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Audit frontend dependencies
        id: frontend_audit
        continue-on-error: true
        working-directory: web-platform/frontend
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          if (audit.error) {
            console.error("npm audit could not complete:", audit.error);
            process.exit(1);
          }
          const counts = audit.metadata?.vulnerabilities;
          const packages = Object.entries(audit.vulnerabilities || {}).map(([name, v]) => ({
            name, severity: v.severity, isDirect: v.isDirect, range: v.range, fixAvailable: v.fixAvailable
          }));
          console.log(JSON.stringify({ counts, packages }, null, 2));
          if (!counts) throw new Error("npm audit did not return vulnerability totals.");
          if (counts.total > 0) process.exit(1);
          NODE
      - name: Enforce frontend lint
        working-directory: web-platform/frontend
        run: npm run lint
      - name: Report frontend lint baseline
        working-directory: web-platform/frontend
        run: |
          ./node_modules/.bin/eslint . --format json > eslint-report.json || true
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync("eslint-report.json","utf8")); const totals=r.reduce((a,f)=>({errors:a.errors+f.errorCount,warnings:a.warnings+f.warningCount,files:a.files+(f.errorCount+f.warningCount>0?1:0)}),{errors:0,warnings:0,files:0}); const rules={}; for (const f of r) for (const m of f.messages) if(m.ruleId) rules[m.ruleId]=(rules[m.ruleId]||0)+1; console.log(JSON.stringify({...totals,topRules:Object.entries(rules).sort((a,b)=>b[1]-a[1]).slice(0,10)},null,2));'
      - name: Build frontend
        working-directory: web-platform/frontend
        run: npm run build
      - name: Run frontend smoke tests
        working-directory: web-platform/frontend
        run: npm test
      - name: Upload dependency and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-security-remediation-candidate
          path: |
            web-platform/frontend/npm-audit.json
            web-platform/frontend/eslint-report.json
            web-platform/frontend/package-lock.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce frontend dependency audit result
        if: steps.frontend_audit.outcome == 'failure'
        run: |
          echo "::error::Frontend dependency audit found unresolved vulnerabilities."
          exit 1

  security-supply-chain:
    name: Static analysis and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep baseline scan
        continue-on-error: true
        run: |
          pipx run semgrep scan --config auto --sarif --output semgrep.sarif .
      - name: Upload Semgrep baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-baseline
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: doka-sbom.spdx.json
          upload-artifact: true
          artifact-name: doka-sbom

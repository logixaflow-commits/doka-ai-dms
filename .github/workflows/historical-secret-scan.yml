name: Historical Secret Scan

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: Gitleaks git history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        run: |
          set +e
          docker run --rm \\
            -v "$GITHUB_WORKSPACE:/repo:ro" \\
            -v "$RUNNER_TEMP:/reports" \\
            zricethezav/gitleaks:v8.24.3 \\
            git --redact --no-banner --report-format json --report-path /reports/gitleaks.json /repo
          scan_status=$?
          if [ -f "$RUNNER_TEMP/gitleaks.json" ]; then
            count=$(python -c 'import json; print(len(json.load(open("'"$RUNNER_TEMP"'/gitleaks.json"))))')
            echo "Historical secret findings: $count"
            # Publish only redacted metadata needed for remediation; never print match values.
            python - <<'PY'
import json, os
p=os.path.join(os.environ["RUNNER_TEMP"], "gitleaks.json")
for f in json.load(open(p)):
    print("FINDING rule={rule} file={file} commit={commit} line={line}".format(
        rule=f.get("RuleID","unknown"), file=f.get("File","unknown"),
        commit=f.get("Commit","unknown")[:12], line=f.get("StartLine","unknown")))
PY
          fi
          exit $scan_status


name: Historical Secret Scan

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: Gitleaks git history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/repo:ro"             zricethezav/gitleaks:v8.24.3             git --redact --no-banner --exit-code 1 /repo

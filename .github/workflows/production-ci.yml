name: Production CI/CD Pipeline (Non-Docker)

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: doka-production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint, Compile & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/web-platform/backend/requirements-local.txt

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-mya poppler-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/web-platform/backend/requirements-local.txt
          pip install flake8 pytest

      - name: Syntax & Lint Verification
        run: |
          python -m compileall -q apps/web-platform/backend
          # admin_activity.py is a deferred ORM-only legacy module: its app.models.database
          # dependency is intentionally absent and it is not mounted by either runtime.
          # Keep the active-runtime lint gate strict without pretending that module is ready.
          flake8 apps/web-platform/backend --count --select=E9,F63,F7,F82 --extend-exclude=admin_activity.py --show-source --statistics

      - name: Verify Database Migration Script
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          PYTHONPATH: apps/web-platform/backend
        run: |
          python scripts/production_migrate.py

      - name: Execute Safety Regression Tests
        env:
          ENVIRONMENT: testing
          DEBUG: "false"
          SECRET_KEY: doka-production-ci-mock-secret-key-at-least-32-chars
          PYTHONPATH: apps/web-platform/backend
        run: |
          pytest -q apps/web-platform/tests/test_safe_workspace_service.py apps/web-platform/tests/test_workspace_backup_service.py apps/web-platform/tests/test_unified_ai_fallback.py apps/web-platform/tests/test_hardening.py

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-platform/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web-platform/frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: apps/web-platform/frontend
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: /api
        run: npm run build

  production-gate:
    name: Production Release Gate
    needs: [backend-quality, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Build Readiness
        run: echo "Doka-AI-DMS passes all standalone production gate checks. Ready for zero-downtime deployment."

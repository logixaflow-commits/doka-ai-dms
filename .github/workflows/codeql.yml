name: CodeQL
# Security baseline: rerun on every security-sensitive workflow change.

on:
  push:
    branches: [main]
    paths:
      - "web-platform/backend/**"
      - "web-platform/frontend/**"
      - "cloudflare_worker/**"
      - "scripts/**"
      - "shared/**"
      - "supabase/**"
      - "pyproject.toml"
      - "web-platform/backend/requirements*.txt"
      - "web-platform/frontend/package*.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "web-platform/backend/**"
      - "web-platform/frontend/**"
      - "cloudflare_worker/**"
      - "scripts/**"
      - "shared/**"
      - "supabase/**"
      - "pyproject.toml"
      - "web-platform/backend/requirements*.txt"
      - "web-platform/frontend/package*.json"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

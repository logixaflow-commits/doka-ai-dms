name: Authenticated Cloud Acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_nonproduction:
        description: "Confirm the base URL is a dedicated non-production acceptance environment with disposable test users."
        type: boolean
        required: true
        default: false
      expected_provider:
        description: "Optionally require a specific source-storage provider."
        type: choice
        required: true
        default: any
        options:
          - any
          - supabase
          - b2

permissions:
  contents: read

concurrency:
  group: doka-authenticated-cloud-acceptance
  cancel-in-progress: false

jobs:
  authenticated-acceptance:
    if: inputs.confirm_nonproduction == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acceptance runner dependency
        run: python -m pip install "httpx>=0.28,<1.0"

      - name: Validate disposable staging test-account secrets
        env:
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          DOKA_STAGING_USER_A_EMAIL: ${{ secrets.DOKA_STAGING_USER_A_EMAIL }}
          DOKA_STAGING_USER_A_PASSWORD: ${{ secrets.DOKA_STAGING_USER_A_PASSWORD }}
          DOKA_STAGING_USER_B_EMAIL: ${{ secrets.DOKA_STAGING_USER_B_EMAIL }}
          DOKA_STAGING_USER_B_PASSWORD: ${{ secrets.DOKA_STAGING_USER_B_PASSWORD }}
        run: |
          test -n "$SUPABASE_STAGING_PUBLISHABLE_KEY" || { echo "::error::Missing SUPABASE_STAGING_PUBLISHABLE_KEY staging secret."; exit 1; }
          test -n "$DOKA_STAGING_USER_A_EMAIL" || { echo "::error::Missing DOKA_STAGING_USER_A_EMAIL staging secret."; exit 1; }
          test -n "$DOKA_STAGING_USER_A_PASSWORD" || { echo "::error::Missing DOKA_STAGING_USER_A_PASSWORD staging secret."; exit 1; }
          test -n "$DOKA_STAGING_USER_B_EMAIL" || { echo "::error::Missing DOKA_STAGING_USER_B_EMAIL staging secret."; exit 1; }
          test -n "$DOKA_STAGING_USER_B_PASSWORD" || { echo "::error::Missing DOKA_STAGING_USER_B_PASSWORD staging secret."; exit 1; }
          test "$DOKA_STAGING_USER_A_EMAIL" != "$DOKA_STAGING_USER_B_EMAIL" || { echo "::error::User A and User B must be distinct staging accounts."; exit 1; }

      - name: Mint fresh staging-only access tokens
        env:
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          DOKA_STAGING_USER_A_EMAIL: ${{ secrets.DOKA_STAGING_USER_A_EMAIL }}
          DOKA_STAGING_USER_A_PASSWORD: ${{ secrets.DOKA_STAGING_USER_A_PASSWORD }}
          DOKA_STAGING_USER_B_EMAIL: ${{ secrets.DOKA_STAGING_USER_B_EMAIL }}
          DOKA_STAGING_USER_B_PASSWORD: ${{ secrets.DOKA_STAGING_USER_B_PASSWORD }}
        run: python scripts/staging_test_auth.py --mode both

      - name: Create exact 50 MiB acceptance fixture
        run: |
          mkdir -p artifacts/fixtures
          python - <<'PY'
          from pathlib import Path
          fixture = Path("artifacts/fixtures/cloud-acceptance-50mib.bin")
          fixture.write_bytes(b"D" * (50 * 1024 * 1024))
          assert fixture.stat().st_size == 52_428_800
          PY

      - name: Run authenticated document lifecycle and isolation acceptance
        env:
          DOKA_CLOUD_BASE_URL: https://doka-ai-dms-staging.logixaflow.workers.dev
          DOKA_CLOUD_EXPECTED_PROVIDER: ${{ inputs.expected_provider }}
        run: |
          if [ "$DOKA_CLOUD_EXPECTED_PROVIDER" = "any" ]; then
            unset DOKA_CLOUD_EXPECTED_PROVIDER
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ.get("DOKA_CLOUD_BASE_URL", "").strip()
          host = (urlparse(url).hostname or "").lower()
          if host != "doka-ai-dms-staging.logixaflow.workers.dev":
              raise SystemExit("Refusing cloud acceptance unless the exact dedicated staging Worker is configured.")
          if urlparse(url).scheme != "https":
              raise SystemExit("DOKA_CLOUD_BASE_URL must be HTTPS.")
          PY
          python scripts/cloud_acceptance.py \
            --output artifacts/cloud-acceptance.json \
            --fifty-mib-file artifacts/fixtures/cloud-acceptance-50mib.bin

      - name: Upload privacy-safe acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doka-cloud-acceptance-evidence
          path: artifacts/cloud-acceptance.json
          if-no-files-found: warn
          retention-days: 14

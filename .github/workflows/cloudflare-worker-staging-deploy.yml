name: Cloudflare Worker Staging Deploy

on:
  # Temporary feature-branch push triggers intentionally removed.
  # Dispatch is restricted by the staging Environment's required reviewers.
  workflow_dispatch:
    inputs:
      confirm_nonproduction:
        description: "Confirm deployment to the dedicated staging Worker only (never production)."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: doka-cloudflare-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_nonproduction == true && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - name: Validate staging-only credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }
      - name: Install pinned Wrangler CLI
        run: npm install --global wrangler@4.64.0
      - name: Build staging Python Worker without deploying
        run: uvx --from workers-py==1.17.7 pywrangler deploy --dry-run --config wrangler.staging.jsonc
      - name: Deploy dedicated staging Worker
        run: uvx --from workers-py==1.17.7 pywrangler deploy --config wrangler.staging.jsonc
      - name: Set fresh staging-only upload-session secret
        run: |
          secret="$(openssl rand -hex 32)"
          test "${#secret}" -ge 32
          printf '%s' "$secret" | wrangler secret put DOKA_STORAGE_SESSION_SECRET --config wrangler.staging.jsonc
      - name: Verify staging health
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          base = "https://doka-ai-dms-staging.logixaflow.workers.dev"
          with urlopen(Request(base + "/health", headers={"Accept": "application/json"}), timeout=20) as response:
              payload = json.load(response)
              if response.status != 200 or payload.get("status") != "healthy":
                  raise SystemExit("Staging health check failed")
          print("Staging health check passed.")
          PY

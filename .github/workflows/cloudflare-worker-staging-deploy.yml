name: Cloudflare Worker Staging Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_nonproduction:
        description: "Confirm deployment to the dedicated staging Worker only (never production)."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: doka-cloudflare-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: inputs.confirm_nonproduction == true && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      DOKA_STAGING_STORAGE_SESSION_SECRET: ${{ secrets.DOKA_STAGING_STORAGE_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
      - name: Validate staging-only credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }
          test -n "$SUPABASE_STAGING_PUBLISHABLE_KEY" || { echo "::error::Missing SUPABASE_STAGING_PUBLISHABLE_KEY secret."; exit 1; }
          test -n "$DOKA_STAGING_STORAGE_SESSION_SECRET" || { echo "::error::Missing DOKA_STAGING_STORAGE_SESSION_SECRET secret."; exit 1; }
          test "${#DOKA_STAGING_STORAGE_SESSION_SECRET}" -ge 32 || { echo "::error::Staging session secret must be at least 32 characters."; exit 1; }
      - name: Install pinned Wrangler CLI
        run: npm install --global wrangler@4.64.0
      - name: Build staging Python Worker without deploying
        run: uvx --from workers-py==1.17.7 pywrangler deploy --dry-run --config wrangler.staging.jsonc
      - name: Deploy dedicated staging Worker
        run: uvx --from workers-py==1.17.7 pywrangler deploy --config wrangler.staging.jsonc
      - name: Set staging-only secrets
        run: |
          printf '%s' "$SUPABASE_STAGING_PUBLISHABLE_KEY" | wrangler secret put SUPABASE_PUBLISHABLE_KEY --config wrangler.staging.jsonc
          printf '%s' "$DOKA_STAGING_STORAGE_SESSION_SECRET" | wrangler secret put DOKA_STORAGE_SESSION_SECRET --config wrangler.staging.jsonc
      - name: Verify staging health and configuration
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          base = "https://doka-ai-dms-staging.logixaflow.workers.dev"
          def get(path):
              request = Request(base + path, headers={"Accept": "application/json", "User-Agent": "Doka-Staging-Acceptance/1.0"})
              with urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"{path} returned HTTP {response.status}")
                  return json.load(response)
          health = get("/health")
          if health.get("status") != "healthy":
              raise SystemExit(f"Unexpected health response: {health!r}")
          config = get("/api/config")
          if config.get("supabase_auth_configured") is not True:
              raise SystemExit("Staging Supabase Auth is not configured.")
          if config.get("storage_bucket_configured") is not True:
              raise SystemExit("Staging Storage bucket is not configured.")
          if config.get("single_user_configured") is True:
              raise SystemExit("Staging unexpectedly has a single-user production gate.")
          print("Staging health/config checks passed; no credentials emitted.")
          PY

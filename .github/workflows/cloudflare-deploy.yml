name: Doka Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "cloudflare_worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: doka-cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Doka Cloud Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 71c6a2f23112d7f6b08541c7e1a79ed1
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub secret is not configured."
            exit 1
          fi
          npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify Worker health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3             https://doka-ai-dms.logixaflow.workers.dev/health

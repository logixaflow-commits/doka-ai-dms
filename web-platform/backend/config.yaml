# Personal Local DMS configuration
# Keep this file small. Deferred enterprise/social/SOP configuration is preserved
# under archive/legacy-enterprise/backend/config.yaml and is not part of the
# current Personal Local runtime.

thresholds:
  unknown: 0.4
  review: 0.7
  approved: 0.85

ocr:
  tesseract_cmd: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  myanmar_lang: "mya"
  eng_lang: "eng"
  preprocessing: true
  dpi: 300
  oem: 3
  psm: 6

duplicate:
  similarity_threshold: 0.85
  near_duplicate_threshold: 0.75
  recent_docs_limit: 500
  hash_algorithm: "sha256"
  min_text_length: 50

keyword_mapping:
  invoice:
    keywords: ["invoice", "inv", "commercial invoice", "proforma invoice", "tax invoice", "debit note", "credit note", "payment request", "billing statement"]
    category: "Invoices"
    confidence_boost: 0.25
    sensitive: true
  contract:
    keywords: ["contract", "agreement", "စာချုပ်", "သဘောတူ"]
    category: "Contracts"
    confidence_boost: 0.25
    sensitive: false
  license:
    keywords: ["license", "licence", "import license", "export license", "permit", "လိုင်စင်", "ခွင့်ပြု"]
    category: "Licenses"
    confidence_boost: 0.25
    sensitive: false
  identity:
    keywords: ["nrc", "national id", "passport", "national registration card", "မှတ်ပုံတင်", "နိုင်ငံကူး"]
    category: "Identity"
    confidence_boost: 0.30
    sensitive: true
  customs:
    keywords: ["customs", "declaration", "customs declaration", "အကောက်ခွန်"]
    category: "Customs"
    confidence_boost: 0.25
    sensitive: false
  shipping:
    keywords: ["bill of lading", "b/l", "bl", "container", "vessel", "shipment", "waybill", "awb"]
    category: "Shipping"
    confidence_boost: 0.25
    sensitive: false
  finance:
    keywords: ["receipt", "payment", "statement", "payment request", "ငွေချေ", "ငွေလွှဲ"]
    category: "Finance"
    confidence_boost: 0.25
    sensitive: true

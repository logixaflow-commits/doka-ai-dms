[project]
name = "doka-cloud-api"
version = "1.0.0"
description = "Doka stateless Cloud API for Cloudflare Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

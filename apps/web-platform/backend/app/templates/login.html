{% extends "base.html" %}
{% block title %}Login - Enterprise DMS{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-slate-100">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-shield-alt text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Enterprise DMS</h1>
                <p class="text-slate-500 mt-2">AI Document Management System</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                    <input type="text" id="username" name="username" required
                           class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Enter your username">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Enter your password">
                </div>

                <div id="loginError" class="hidden mb-4 p-3 bg-red-100 border border-red-300 rounded-lg text-red-700 text-sm"></div>

                <button type="submit" id="loginButton"
                        class="w-full btn-primary py-3 text-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-500">
                <p>Default admin: admin / admin123</p>
            </div>
        </div>
    </div>
</div>

<script>
async function handleLogin(event) {
    event.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');
    const loginButton = document.getElementById('loginButton');
    
    errorDiv.classList.add('hidden');
    loginButton.disabled = true;
    loginButton.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Logging in...';
    
    try {
        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        if (resp.ok) {
            const data = await resp.json();
            setToken(data.access_token);
            localStorage.setItem('refresh_token', data.refresh_token);
            showToast('Login successful!');
            window.location.href = '/dashboard';
        } else {
            const error = await resp.json();
            errorDiv.textContent = error.detail || 'Login failed';
            errorDiv.classList.remove('hidden');
        }
    } catch (e) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.classList.remove('hidden');
    } finally {
        loginButton.disabled = false;
        loginButton.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Login';
    }
}

// Check if already logged in
document.addEventListener('DOMContentLoaded', async () => {
    const token = getToken();
    if (token) {
        try {
            const resp = await apiFetch('/api/auth/me');
            if (resp.ok) {
                window.location.href = '/dashboard';
            }
        } catch (e) {
            removeToken();
        }
    }
});
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enterprise DMS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
                        dark: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; }
        .glass-panel { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); }
        .nav-item { transition: all 0.2s ease; }
        .nav-item:hover { background: rgba(59, 130, 246, 0.08); color: #2563eb; }
        .nav-item.active { background: rgba(59, 130, 246, 0.12); color: #1d4ed8; border-right: 3px solid #2563eb; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; transition: box-shadow 0.2s, transform 0.2s; }
        .card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .btn-primary { background: #2563eb; color: white; padding: 0.5rem 1.25rem; border-radius: 0.5rem; font-weight: 500; transition: all 0.2s; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .btn-secondary { background: white; color: #475569; padding: 0.5rem 1.25rem; border-radius: 0.5rem; font-weight: 500; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-processing { background: #dbeafe; color: #1e40af; }
        .status-completed { background: #dcfce7; color: #166534; }
        .status-approved { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        .status-review { background: #fef9c3; color: #854d0e; }
        .status-unknown { background: #f3f4f6; color: #6b7280; }
        .status-duplicate { background: #fce7f3; color: #9d174d; }
        .status-failed { background: #fee2e2; color: #991b1b; }
        .sidebar { background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: #94a3b8; text-decoration: none; transition: all 0.2s; border-radius: 0.5rem; margin: 0 0.5rem; }
        .sidebar-link:hover { color: white; background: rgba(255,255,255,0.08); }
        .sidebar-link.active { color: white; background: rgba(37,99,235,0.3); }
        .progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .toast { position: fixed; top: 1rem; right: 1rem; padding: 1rem 1.5rem; border-radius: 0.5rem; font-weight: 500; z-index: 9999; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 0.75rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800">
    {% block body %}{% endblock %}
    <script src="/static/js/fetch_helper.js"></script>
    <script>
        const API_BASE = window.location.origin + '/api';
        let currentUser = null;

        function getToken() { return localStorage.getItem('access_token'); }
        function setToken(token) { localStorage.setItem('access_token', token); }
        function removeToken() { localStorage.removeItem('access_token'); localStorage.removeItem('refresh_token'); }

        async function apiFetch(url, options = {}) {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const resp = await fetch(url, { ...options, headers });
            if (resp.status === 401) { 
                removeToken(); 
                if (window.location.pathname !== '/login') {
                    window.location.href = '/login'; 
                }
            }
            return resp;
        }

        async function loadCurrentUser() {
            try {
                const resp = await apiFetch('/api/auth/me');
                if (resp.ok) {
                    currentUser = await resp.json();
                    return currentUser;
                }
            } catch (e) { console.error('Failed to load user', e); }
            return null;
        }

        function showToast(message, type = 'success') {
            const colors = { success: 'bg-emerald-500', error: 'bg-red-500', warning: 'bg-amber-500', info: 'bg-blue-500' };
            const toast = document.createElement('div');
            toast.className = `toast ${colors[type] || colors.success} text-white`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function formatDate(iso) {
            if (!iso) return '-';
            return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + sizes[i];
        }

        function statusBadge(status) {
            const cls = 'status-' + (status || 'unknown');
            return `<span class="status-badge ${cls}">${(status || 'UNKNOWN').toUpperCase()}</span>`;
        }

        function logout() {
            apiFetch('/api/auth/logout', { method: 'POST' }).finally(() => {
                removeToken();
                window.location.href = '/login';
            });
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="dkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081120" />
      <stop offset="100%" stop-color="#020611" />
    </linearGradient>

    <linearGradient id="dkBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="dkFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="dkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Container Tile -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#dkBg)" stroke="url(#dkBorder)" stroke-width="4.5" />

  <!-- Hexagonal Security Shield -->
  <path d="M 100 38 L 150 56 V 98 C 150 126, 128 152, 100 162 C 72 152, 50 126, 50 98 V 56 Z" 
        fill="#0b172d" stroke="url(#dkBorder)" stroke-width="3" stroke-linejoin="round" />

  <!-- Folded Document Vault Silhouette -->
  <path d="M 78 68 H 118 L 134 84 V 132 H 78 Z" fill="#0f1f38" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round" />
  <!-- Folded Corner -->
  <path d="M 118 68 V 84 H 134" fill="url(#dkFold)" stroke="#38bdf8" stroke-width="3" />

  <!-- Stylized Modern "D" Archway -->
  <path d="M 94 92 H 108 C 116 92, 122 98, 122 106 C 122 114, 116 120, 108 120 H 94 Z" 
        fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Emerald Verification Pip (Security Active) -->
  <circle cx="135" cy="135" r="7" fill="#10b981" filter="url(#dkGlow)" />
  <circle cx="135" cy="135" r="3" fill="#ffffff" />
</svg>